<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    
    <div class="flex flex-col items-center gap-4 p-6">
  <h1 class="text-3xl font-bold">Weather App</h1>

  <form class="searchForm flex gap-2 w-full max-w-md">
    <input
      type="text"
      class="searchInput flex-1 border-2 border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter city name..."
      required
    />

    <button
      type="submit"
      class="searchBtn bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-600 active:scale-95 transition"
    >
      Search
    </button>
  </form>

  <div class="weatherContainer w-full max-w-md"></div>
</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
